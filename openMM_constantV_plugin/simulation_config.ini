# ═══════════════════════════════════════════════════════════
# ConstantV Plugin - Simulation Configuration File
# ═══════════════════════════════════════════════════════════
# 这个配置文件包含所有模拟参数，修改这里的值即可调整模拟
# 不需要修改Python代码！
#
# 对应Original的run_openMM.py中的各个参数
# ═══════════════════════════════════════════════════════════

[System]
# 系统文件路径
# PDB文件（可以是相对路径或绝对路径）
pdb_file = /home/andy/test_optimization/OpenMM-ConstantV(original)/nvt_0V_15ns.pdb

# Force field文件目录
forcefield_dir = /home/andy/test_optimization/OpenMM-ConstantV(original)/ffdir/

# Force field XML文件列表（相对于forcefield_dir，用逗号分隔）
forcefield_files = sapt_residues.xml,
                   graph_residue_c.xml,
                   graph_residue_n.xml,
                   sapt_noDB_2sheets.xml,
                   graph_c_freeze.xml,
                   graph_n_freeze.xml

# 非键cutoff距离 (nm)
# 对应Original Line 49: cutoff
nonbonded_cutoff = 1.4

[Electrodes]
# 电极配置
# 对应Original Line 73, 78, 109

# 电压 (Volts)
voltage = 0.0

# Cathode chain indices（用逗号分隔，对应Original的tuple）
# 对应Original: cathode_index = (0, 2)
cathode_chains = 0, 2

# Anode chain indices（用逗号分隔）
# 对应Original: anode_index = (1, 3)
anode_chains = 1, 3

# 排除的元素符号（用逗号分隔）
# 对应Original: exclude_element = ("H",)
exclude_elements = H

[SCF]
# SCF参数
# 对应Original Line 163, 34

# SCF迭代次数（每次SCF做几次迭代）
# 对应Original: Niterations = 4
num_iterations = 4

# SCF频率 (femtoseconds)
# 每隔多少fs更新一次电荷
# 对应Original: freq_charge_update_fs = 200
scf_frequency_fs = 200

[Electrolyte]
# 电解质配置
# 对应Original Line 113

# Atom数量cutoff（residue atom数 < cutoff 则为electrolyte）
# 对应Original: Natom_cutoff = 100
natom_cutoff = 100

[Simulation]
# 模拟参数
# 对应Original Line 34, 47

# 总模拟时间 (nanoseconds)
# 对应Original: simulation_time_ns = 0.5
total_time_ns = 0.5

# 时间步长 (picoseconds)
# 对应Original Line 47: timestep = 0.001
timestep_ps = 0.001

# 初始温度 (Kelvin)
temperature = 300.0

[Output]
# 输出设置
# 对应Original Line 37, 34

# 输出目录
output_dir = 1v_0.5ns

# 轨迹输出频率 (picoseconds)
# 对应Original: freq_traj_output_ps = 10
trajectory_output_ps = 10.0

# Log输出频率 (steps)
# 多少步输出一次log信息
log_output_steps = 100

# 是否输出电荷数据
# 对应Original: write_charges = False
write_charges = False

# 是否覆盖已存在的输出目录
overwrite_output = True

[Platform]
# 计算平台设置
# 对应Original Line 100

# 平台名称: CUDA, OpenCL, CPU, Reference
# 对应Original: MMsys.set_platform('CUDA')
platform_name = CUDA

# CUDA精度设置: mixed, single, double
# 对应Original Line 167: properties = {'Precision': 'mixed'}
cuda_precision = mixed

[Advanced]
# 高级选项（通常不需要修改）

# 是否使用SAPT-FF exclusions
# 对应Original: flag_SAPT_FF_exclusions = True
sapt_ff_exclusions = True

# 约束类型: HBonds, AllBonds, None
constraints = HBonds

# 是否使用rigid water
rigid_water = True

# 递归深度限制（用于大残基）
# 对应Original Line 22
recursion_limit = 2000

# Console输出频率（每多少步在屏幕输出一次进度）
console_output_frequency_ps = 10.0
