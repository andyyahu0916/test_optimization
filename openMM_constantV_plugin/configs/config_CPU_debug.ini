# ═══════════════════════════════════════════════════════════
# 示例配置: CPU平台，用于调试
# ═══════════════════════════════════════════════════════════

[System]
pdb_file = /home/andy/test_optimization/OpenMM-ConstantV(original)/nvt_0V_15ns.pdb
forcefield_dir = /home/andy/test_optimization/OpenMM-ConstantV(original)/ffdir/
forcefield_files = sapt_residues.xml,
                   graph_residue_c.xml,
                   graph_residue_n.xml,
                   sapt_noDB_2sheets.xml,
                   graph_c_freeze.xml,
                   graph_n_freeze.xml
nonbonded_cutoff = 1.4

[Electrodes]
voltage = 0.5
cathode_chains = 0, 2
anode_chains = 1, 3
exclude_elements = H

[SCF]
num_iterations = 2
scf_frequency_fs = 100

[Electrolyte]
natom_cutoff = 100

[Simulation]
total_time_ns = 0.001
timestep_ps = 0.001
temperature = 300.0

[Output]
output_dir = debug_cpu
trajectory_output_ps = 0.1
log_output_steps = 10
write_charges = False
overwrite_output = True

[Platform]
platform_name = CPU
cuda_precision = mixed

[Advanced]
sapt_ff_exclusions = True
constraints = HBonds
rigid_water = True
recursion_limit = 2000
console_output_frequency_ps = 0.1
