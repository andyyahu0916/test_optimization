[workspace]
name = "md_simulation"
version = "0.1.0"
description = "High-performance OpenMM & Analysis environment"
authors = ["Andy <andyyuan.hu@gmail.com>"]
channels = ["conda-forge"] # Pixi 預設使用 conda-forge，這對 OpenMM 最友善
platforms = ["linux-64"]   # 明確指定平台

[dependencies]
# --- Core Computing & CUDA Stack (對應你原本的第一步) ---
cuda-toolkit = ">=12.9.1,<13"
cudnn = ">=9.10.2.21,<10"
mkl-devel = ">=2025.3.1,<2026"
tbb-devel = ">=2022.3.0,<2023"
compiler-rt = ">=22.1.2,<23"
fftw = ">=3.3.10,<4"
magma = ">=2.9.0,<3"
# 強烈建議：明確指定 CUDA 版本，避免未來因為版本漂移導致 OpenMM 抓錯 build
# cuda-version = "12.0" 

# --- MD Core ---
openmm = ">=8.5.0,<9"
mdtraj = ">=1.11.1,<2"
mdanalysis = ">=2.10.0,<3"
openmmtools = ">=0.26.0,<0.27"

# --- Acceleration & Compilation ---
numba = ">=0.64.0,<0.65"
cupy = ">=14.0.1,<15"
cython = ">=3.2.4,<4"
dask = ">=2026.3.0,<2027"

# --- Data Science & Math ---
numpy = ">=2.4.3,<3"
pandas = ">=2.3.3,<3"
scipy = ">=1.16.3,<2"
scikit-learn = ">=1.8.0,<2"
statsmodels = ">=0.14.6,<0.15"
sympy = ">=1.14.0,<2"
networkx = ">=3.6.1,<4"
joblib = ">=1.5.3,<2"

# --- Visualization & Interactive ---
jupyterlab = ">=4.5.6,<5"
ipython = ">=9.11.0,<10"
ipykernel = ">=7.2.0,<8"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
plotly = ">=6.6.0,<7"
bokeh = ">=3.9.0,<4"
altair = ">=6.0.0,<7"
tabulate = ">=0.10.0,<0.11"
tqdm = ">=4.67.3,<5"
lxml = ">=6.0.2,<7"

[system-requirements]
# 這是 Pixi 的特異功能，告訴 solver 本機必須有滿足此條件的 driver
#cuda = "12"
