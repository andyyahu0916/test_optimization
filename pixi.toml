[workspace]
name = "md_simulation"
version = "0.1.0"
description = "High-performance OpenMM & Analysis environment"
authors = ["Andy <andyyuan.hu@gmail.com>"]
channels = ["conda-forge"] # Pixi 預設使用 conda-forge，這對 OpenMM 最友善
platforms = ["linux-64"]   # 明確指定平台

[dependencies]
# --- Core Computing & CUDA Stack (對應你原本的第一步) ---
cuda-toolkit = "*"
cudnn = "*"
mkl-devel = "*"
tbb-devel = "*"
compiler-rt = "*"
fftw = "*"
magma = "*"
# 強烈建議：明確指定 CUDA 版本，避免未來因為版本漂移導致 OpenMM 抓錯 build
# cuda-version = "12.0" 

# --- MD Core ---
openmm = "*"
mdtraj = "*"
mdanalysis = "*"
openmmtools = "*"

# --- Acceleration & Compilation ---
numba = "*"
cupy = "*"
cython = "*"
dask = "*"

# --- Data Science & Math ---
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
statsmodels = "*"
sympy = "*"
networkx = "*"
joblib = "*"

# --- Visualization & Interactive ---
jupyterlab = "*"
ipython = "*"
ipykernel = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
bokeh = "*"
altair = "*"
tabulate = "*"
tqdm = "*"
lxml = "*"

[system-requirements]
# 這是 Pixi 的特異功能，告訴 solver 本機必須有滿足此條件的 driver
cuda = "12"