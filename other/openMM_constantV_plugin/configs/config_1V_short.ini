# ═══════════════════════════════════════════════════════════
# 示例配置: 1V电压，短时间测试 (10 ps)
# ═══════════════════════════════════════════════════════════

[System]
pdb_file = /home/andy/test_optimization/OpenMM-ConstantV(original)/nvt_0V_15ns.pdb
forcefield_dir = /home/andy/test_optimization/OpenMM-ConstantV(original)/ffdir/
forcefield_files = sapt_residues.xml,
                   graph_residue_c.xml,
                   graph_residue_n.xml,
                   sapt_noDB_2sheets.xml,
                   graph_c_freeze.xml,
                   graph_n_freeze.xml
nonbonded_cutoff = 1.4

[Electrodes]
voltage = 1.0
cathode_chains = 0, 2
anode_chains = 1, 3
exclude_elements = H

[SCF]
num_iterations = 4
scf_frequency_fs = 200

[Electrolyte]
natom_cutoff = 100

[Simulation]
total_time_ns = 1
timestep_ps = 0.001
temperature = 300.0

[Output]
output_dir = test_1V_10ps
trajectory_output_ps = 1.0
log_output_steps = 100
write_charges = False
overwrite_output = True

[Platform]
platform_name = CUDA
cuda_precision = mixed

[Advanced]
sapt_ff_exclusions = True
constraints = HBonds
rigid_water = True
recursion_limit = 2000
console_output_frequency_ps = 1.0
